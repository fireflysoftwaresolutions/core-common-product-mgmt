spring:
  application:
    name: core-common-product-mgmt
    version: 1.0.0
    description: Product Management Core Application
    team:
      name: Firefly Software Foundation
      email: dev@fireflysoftware.io

  r2dbc:
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE}
    user: ${FLYWAY_USERNAME:${DB_USERNAME}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}

  threads:
    virtual:
      enabled: true

server:
  address: ${SERVER_ADDRESS:localhost}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: method
    docExpansion: none
    filter: true
  packages-to-scan: io.fireflysoftware.core.product.web.controllers
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    io.fireflysoftware: DEBUG
    org.springframework.r2dbc: DEBUG
    org.flywaydb: DEBUG

firefly:
  security:
    resource-server:
      issuer: ${PRODUCT_DEFINITION_ISSUER:}
      audiences: ${PRODUCT_DEFINITION_AUDIENCE:}
      jwk-set-uri: ${PRODUCT_DEFINITION_JWKS_URI:}
      tenant-claim-paths: [tenant_id]
      tenant-required: true
      scope-claim-paths: [scope, scp]
      strict-policy: true

product:
  definitions:
    serving:
      policy-base-url: ${PRODUCT_DEFINITION_POLICY_URL:}
      policy-path: ${PRODUCT_DEFINITION_POLICY_PATH:}
