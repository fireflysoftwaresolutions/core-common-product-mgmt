openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Private product costs
  description: Current-authorized private cost editing context
- name: Product Documentation Requirements
  description: APIs for managing documentation requirements for products during the
    contracting/opening phase
- name: Product Documentation
  description: "APIs for managing documentation (manuals, guides, etc.) associated\
    \ with a specific product"
- name: Product Relationship
  description: APIs for managing relationships between products
- name: Product Configuration
  description: APIs for managing key-value configuration data for products
- name: Account tariff definitions
  description: Current-authorized retained public metadata; operational admission
    remains NOT_ADMITTED
- name: Product
  description: APIs for managing core product entities in the product management platform
- name: Product Version
  description: APIs for managing different versions of a product
- name: Product Category
  description: APIs for managing product categories in the product management platform
- name: Private product review
  description: Current-authorized checker selection and private cost inspection
- name: Governed product lifecycle
  description: Current-authorized staff commands; publication metadata remains NOT_ADMITTED
- name: Product Localization
  description: "APIs for managing localized data (translations, region-specific info)\
    \ for a product"
- name: Product Pricing
  description: Read-only aggregator that composes product configurations into pricing
    parameters for calculators
- name: Product publication workflow
  description: Current-authorized advisory publication metadata
paths:
  /api/v1/products/{productId}:
    get:
      tags:
      - Product
      summary: Get product by ID
      description: Retrieve a specific product by its unique identifier
      operationId: getProductById
      parameters:
      - name: productId
        in: path
        description: Unique identifier of the product
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Optional retry key for scoped POST, PUT, PATCH, and DELETE response\
          \ reuse. Safe methods ignore it. Reuse requires configured trusted identity\
          \ and namespace; changed input returns 409. Business effects require durable\
          \ application idempotency."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved the product
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
        "404":
          description: Product not found
    put:
      tags:
      - Product
      summary: Update product
      description: Update the information of an existing product by its unique identifier
      operationId: updateProduct
      parameters:
      - name: productId
        in: path
        description: Unique identifier of the product
        required: true
