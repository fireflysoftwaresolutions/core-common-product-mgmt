          type: boolean
          description: Whether the product is currently offered to customers (derived
            from product_status = ACTIVE)
          example: true
        features:
          type: array
          description: Commercial bullet list shown on the product card
          example:
          - From 1.000 to 60.000 euros
          - Term 12-96 months
          items:
            type: string
            description: Commercial bullet list shown on the product card
            example: "[\"From 1.000 to 60.000 euros\",\"Term 12-96 months\"]"
        currency:
          type: string
          description: ISO 4217 currency code
          example: EUR
        minAmount:
          type: number
          description: Inclusive minimum principal amount the product accepts
          example: 1000
        maxAmount:
          type: number
          description: Inclusive maximum principal amount the product accepts
          example: 60000
        minTerm:
          type: integer
          description: "Inclusive minimum term, in months"
          format: int32
          example: 12
        maxTerm:
          type: integer
          description: "Inclusive maximum term, in months"
          format: int32
          example: 96
        interestRates:
          type: array
          description: Ordered list of interest-rate brackets
          items:
            $ref: "#/components/schemas/InterestRateBracketDTO"
        fees:
          type: array
          description: List of applicable fees
          items:
            $ref: "#/components/schemas/FeeDefinitionDTO"
