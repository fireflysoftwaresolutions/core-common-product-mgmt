        description: "Optional retry key for scoped POST, PUT, PATCH, and DELETE response\
          \ reuse. Safe methods ignore it. Reuse requires configured trusted identity\
          \ and namespace; changed input returns 409. Business effects require durable\
          \ application idempotency."
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDTO"
        required: true
      responses:
        "200":
          description: Product successfully updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDTO"
        "400":
          description: Invalid product data
        "404":
          description: Product not found
    delete:
      tags:
      - Product
      summary: Delete product
      description: Remove an existing product by its unique identifier
      operationId: deleteProduct
      parameters:
      - name: productId
        in: path
        description: Unique identifier of the product
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Idempotency-Key
        in: header
        description: "Optional retry key for scoped POST, PUT, PATCH, and DELETE response\
          \ reuse. Safe methods ignore it. Reuse requires configured trusted identity\
          \ and namespace; changed input returns 409. Business effects require durable\
