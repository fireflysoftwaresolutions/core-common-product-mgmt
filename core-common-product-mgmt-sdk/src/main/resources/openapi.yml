          type: number
          description: Inclusive upper bound of the principal amount
          example: 60000
        tin:
          type: number
          description: Nominal interest rate (TIN) expressed as an annual percentage
          example: 7.99
      description: Interest-rate bracket applicable to a product within an amount
        range
