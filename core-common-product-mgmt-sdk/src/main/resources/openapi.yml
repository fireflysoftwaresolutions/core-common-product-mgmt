          description: Unique identifier of the product
          format: uuid
          example: 00000000-0000-0000-0000-00000000000a
        productCode:
          type: string
          description: Business code of the product
          example: PERSONAL_LOAN_DEMO
        productType:
          type: string
          description: "Derived product type label (e.g. PERSONAL_LOAN, LEASING)"
          example: PERSONAL_LOAN
